[project]
name = "winlog-threat-hunter"
version = "0.1.0"
description = "Parses exported Windows Security/Sysmon events and flags suspicious authentication and privilege-escalation patterns."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
winlog-threat-hunter = "winlog_threat_hunter.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
